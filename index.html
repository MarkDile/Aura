<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Aura · mano</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee;
    font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mirror { transform: scaleX(-1); }
  #intro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px; text-align: center; z-index: 5; background: #000; }
  h1 { margin: 0; font-weight: 600; letter-spacing: .08em; }
  p { margin: 0; max-width: 32ch; color: #aaa; line-height: 1.4; }
  button { font: inherit; font-size: 17px; padding: 12px 22px; border-radius: 999px; border: 0;
    background: #39d0ff; color: #001018; font-weight: 600; }
  #hud { position: fixed; left: 12px; top: calc(12px + env(safe-area-inset-top)); z-index: 4;
    background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
  #flip { position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top)); z-index: 4;
    font-size: 14px; padding: 8px 14px; background: rgba(255,255,255,.85); }
  small { color: #666; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div id="intro">
  <h1>Aura</h1>
  <p>Test 2 (v7): la pagina disegna i 21 punti della mano sopra il video. Punta del pollice (4) e dell'indice (8) sono evidenziate.</p>
  <button id="start">Apri la fotocamera</button>
  <small id="msg">versione 7</small>
</div>

<div id="hud" hidden>Carico il modello…</div>
<button id="flip" hidden>Cambia fotocamera</button>

<script>
  function showErr(t){ var m=document.getElementById("msg"), h=document.getElementById("hud");
    m.textContent="Errore: "+t; h.hidden=false; h.textContent="Errore: "+t; }
  window.addEventListener("error", function(e){ showErr(e.message || "script"); });
  window.addEventListener("unhandledrejection", function(e){ showErr((e.reason && e.reason.message) || e.reason); });
  window.auraOk=false;
  setTimeout(function(){ if(!window.auraOk) showErr("la libreria MediaPipe non si è caricata (rete o browser). Prova Chrome aggiornato."); }, 8000);
</script>
<script type="module">
import { FilesetResolver, HandLandmarker, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const WASM  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const flip = document.getElementById("flip");
const msg = document.getElementById("msg");
const draw = new DrawingUtils(ctx);
window.auraOk = true;
let delegate = "CPU";

let landmarker = null;
let facing = "user";          // frontale: comoda per provare sulla propria mano
let stream = null;
let lastVideoTime = -1;
let firstOpen = true;
let permState = "?";
try { navigator.permissions.query({ name: "camera" }).then(r => { permState = r.state; r.onchange = () => permState = r.state; }); } catch (e) {}

async function loadModel(d) {
  hud.textContent = "Carico il modello (" + d + ")…";
  const files = await FilesetResolver.forVisionTasks(WASM);
  return await HandLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: MODEL, delegate: d },
    runningMode: "VIDEO",
    numHands: 2
  });
}

function withTimeout(promise, ms, what) {
  return Promise.race([promise, new Promise((_, rej) =>
    setTimeout(() => rej(new Error(what + ": il telefono non risponde dopo " + ms/1000 + " s. Riavvia il telefono e riprova.")), ms))]);
}

async function openCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null;
                video.srcObject = null; await new Promise(r => setTimeout(r, 300)); }
  // tentativi dal più preciso al più semplice: alcuni Samsung rifiutano i vincoli
  // prima la richiesta più semplice (come webcamtests e la versione 2, che funzionavano)
  const tries = firstOpen ? [true, { facingMode: facing }] : [{ facingMode: facing }, true];
  firstOpen = false;
  let lastErr = null;
  for (const v of tries) {
    try {
      const t0 = Date.now();
      const tick = setInterval(() => {
        msg.textContent = `Chiedo la fotocamera… ${Math.round((Date.now()-t0)/1000)} s · permesso: ${permState} · prova ${tries.indexOf(v)+1}/${tries.length}`;
      }, 500);
      try {
      stream = await withTimeout(navigator.mediaDevices.getUserMedia({ audio: false, video: v }), 8000, "Fotocamera");
      } finally { clearInterval(tick); }
      break;
    } catch (e) {
      lastErr = e;
      if (e.name === "NotAllowedError") throw e;   // permesso negato: inutile riprovare
      await new Promise(r => setTimeout(r, 500));
    }
  }
  if (!stream) {
    if (lastErr && lastErr.name === "NotReadableError")
      throw new Error("la fotocamera è occupata o bloccata. Chiudi le altre schede e app che la usano (anche la pagina vecchia), poi riprova.");
    throw lastErr;
  }
  // il video deve essere visibile: Chrome Android non avvia i video nascosti
  document.getElementById("intro").hidden = true;
  hud.hidden = false;
  hud.textContent = "Avvio il video (" + (facing === "user" ? "frontale" : "posteriore") + ")…";
  video.autoplay = true;
  video.srcObject = stream;
  video.play().catch(e => console.warn("play:", e));
  const t0 = performance.now();
  while (!(video.videoWidth > 0 && video.readyState >= 2)) {
    if (performance.now() - t0 > 6000) {
      const s = stream.getVideoTracks()[0];
      const info = s ? `traccia ${s.readyState}, muta: ${s.muted}` : "nessuna traccia";
      if (facing === "user") {            // la frontale non manda immagini: provo la posteriore
        facing = "environment";
        hud.textContent = "La frontale non risponde, provo la posteriore…";
        return openCamera();
      }
      throw new Error("la fotocamera non manda immagini (" + info + ")");
    }
    await new Promise(r => setTimeout(r, 200));
  }
  const st = stream.getVideoTracks()[0]?.getSettings?.() || {};
  if (st.facingMode) facing = st.facingMode;
  const m = facing === "user";
  video.classList.toggle("mirror", m);
  canvas.classList.toggle("mirror", m);
}

function loop() {
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    if (canvas.width !== video.videoWidth) {
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    }
    let res;
    try { res = landmarker.detectForVideo(video, performance.now()); }
    catch (e) { hud.textContent = "Errore nel tracciamento (" + delegate + "): " + e.message; requestAnimationFrame(loop); return; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let info = `Mani: ${res.landmarks.length} · ${delegate} · ${canvas.width}×${canvas.height}`;
    res.landmarks.forEach((lm, i) => {
      draw.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS, { color: "#39d0ff", lineWidth: 4 });
      draw.drawLandmarks(lm, { color: "#ffffff", fillColor: "#39d0ff", radius: 5 });
      // pollice (4) e indice (8): servono per il pinch
      draw.drawLandmarks([lm[4], lm[8]], { color: "#ffffff", fillColor: "#ff4fa3", radius: 11 });
      draw.drawConnectors([lm[4], lm[8]], [{ start: 0, end: 1 }], { color: "#ff4fa3", lineWidth: 3 });
      const d = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
      const side = res.handednesses?.[i]?.[0]?.categoryName ?? "?";
      info += `<br>${side}: distanza 4–8 = ${d.toFixed(3)}`;
    });
    hud.innerHTML = info;
  }
  requestAnimationFrame(loop);
}

document.getElementById("start").addEventListener("click", async () => {
  try {
    msg.textContent = "Apro la fotocamera…";
    await openCamera();
    try { landmarker = await loadModel("CPU"); }
    catch (e) { console.warn(e); delegate = "GPU"; landmarker = await loadModel("GPU"); }
    hud.textContent = "Mostra la mano alla fotocamera (" + delegate + ")";
    flip.hidden = false;
    loop();
  } catch (e) {
    msg.textContent = "Errore: " + e.name + " · " + e.message;
    document.getElementById("intro").hidden = false;
    hud.hidden = false; hud.textContent = msg.textContent;
    console.error(e);
  }
});

window.addEventListener("pagehide", () => { if (stream) stream.getTracks().forEach(t => t.stop()); });

flip.addEventListener("click", async () => {
  facing = facing === "user" ? "environment" : "user";
  try { await openCamera(); } catch (e) { hud.textContent = "Errore: " + e.message; }
});
</script>
</body>
</html>
