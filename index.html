<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Aura · pianeta sul palmo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee;
    font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  #three { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  video, canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mirror { transform: scaleX(-1); }
  #panel { position: fixed; left: 0; right: 0; top: 0; z-index: 3; padding: 12px;
    padding-top: calc(12px + env(safe-area-inset-top)); background: rgba(0,0,0,.6); }
  h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: .08em; }
  button { font: inherit; font-size: 15px; padding: 9px 15px; border-radius: 999px; border: 0;
    background: #39d0ff; color: #001018; font-weight: 600; margin: 4px 6px 4px 0; }
  button.sec { background: rgba(255,255,255,.85); }
  #info { font-size: 14px; line-height: 1.5; margin-top: 6px; }
  #log { font: 12px/1.4 ui-monospace, monospace; color: #9fe; margin-top: 6px; max-height: 24vh; overflow: auto; white-space: pre-wrap; }
  #ver { color: #888; font-size: 12px; }
  #fps { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 4;
    background: rgba(0,0,0,.7); color: #fff; border-radius: 12px; padding: 8px 12px;
    font: 600 15px/1.35 ui-monospace, monospace; text-align: right; }
  #fps b { font-size: 30px; color: #39d0ff; }
  #pinch { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 4;
    background: rgba(0,0,0,.7); color: #fff; border-radius: 12px; padding: 8px 12px;
    font: 600 15px/1.35 ui-monospace, monospace; }
  #pinch b { font-size: 30px; color: #ff4fa3; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="canvas"></canvas>
<canvas id="three"></canvas>

<div id="fps" hidden><b id="fpsNow">–</b> fps<br><span id="fpsMore">media 10 s: –</span></div>
<div id="pinch" hidden>pinch <b id="pinchN">0</b><br><span id="pinchState">aperto</span></div>
<div id="panel">
  <h1>Aura <span id="ver">versione 11 · <span id="clock">0</span> s</span></h1>
  <button id="start">Apri la fotocamera</button>
  <span id="tools" hidden>
    <button id="flip" class="sec">Cambia fotocamera</button>
    <button id="filter" class="sec">Filtro: B</button>
    <button id="engine" class="sec">Motore: GPU</button>
    <button id="skel" class="sec">Scheletro: sì</button>
    <button id="zero" class="sec">Azzera pinch</button>
    <button id="hide" class="sec">Nascondi diario</button>
  </span>
  <div id="info">Apri il palmo verso il telefono per mezzo secondo: compare la Terra con la Luna. Pollice e indice che si toccano = pinch.</div>
  <div id="log"></div>
</div>

<!-- Script normale (non modulo): parte sempre, anche se MediaPipe non si carica -->
<script>
  var T0 = Date.now();
  var logEl = document.getElementById("log");
  function log(t) {
    var s = ((Date.now() - T0) / 1000).toFixed(1);
    logEl.textContent += s + " s · " + t + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }
  // orologio: se si ferma, la pagina è bloccata
  setInterval(function () {
    document.getElementById("clock").textContent = Math.round((Date.now() - T0) / 1000);
  }, 500);
  window.addEventListener("error", function (e) { log("ERRORE: " + e.message); });
  window.addEventListener("unhandledrejection", function (e) {
    log("ERRORE: " + ((e.reason && (e.reason.name + " " + e.reason.message)) || e.reason));
  });
  log("pagina caricata · " + (navigator.userAgent.match(/(SamsungBrowser|Chrome|Version)\/[\d.]+/) || ["browser ?"])[0]);
  log("HTTPS: " + window.isSecureContext + " · camera API: " + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
</script>

<script type="module">
const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const info = $("info"), startBtn = $("start");
const log = window.log;

const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

// ================= REGOLAZIONI (azione 16: prova A, B, C) =================
// Filtro One Euro: minCutoff basso = più fermo ma più lento; beta alto = più pronto nei movimenti veloci.
const FILTRI = {
  A: { minCutoff: 0.6, beta: 0.004, nome: "fermo" },
  B: { minCutoff: 1.2, beta: 0.010, nome: "equilibrato" },
  C: { minCutoff: 2.5, beta: 0.030, nome: "pronto" },
};
const ORDINE_FILTRI = ["spento", "A", "B", "C"];
// Pinch: distanza punte pollice (4) e indice (8) divisa per la misura della mano (polso 0 – base medio 9)
const PINCH_CHIUDE = 0.22;   // sotto questa soglia il pinch si chiude
const PINCH_APRE = 0.32;     // sopra questa soglia si riapre (isteresi: niente lampeggio)
const PALMO_APERTO_MS = 500; // mezzo secondo di palmo aperto per far comparire la Terra
const MANO_PERSA_MS = 600;   // dopo quanto la Terra sparisce se la mano non si vede
const RAGGIO_TERRA = 0.42;   // raggio della Terra rispetto alla misura della mano (0–9)
const SOPRA_PALMO = 0.55;    // quanto sopra il centro del palmo (in misure di mano, verso l'alto dello schermo)
// ==========================================================================

let stream = null, facing = null, landmarker = null, mp = null, files = null, draw = null;
let lastVideoTime = -1, running = false, threeLoaded = false;
let filtroScelto = "B", motore = "GPU", scheletro = true;

// ---------------- contatore fps ----------------
const fpsBox = $("fps"), fpsNow = $("fpsNow"), fpsMore = $("fpsMore");
let fFrames = 0, fMs = 0, fStart = performance.now(), fHist = [], fLogged = 0;
function countFrame(ms) {
  fFrames++; fMs += ms;
  const now = performance.now();
  if (now - fStart >= 1000) {
    const fps = fFrames * 1000 / (now - fStart), avgMs = fMs / fFrames;
    fHist.push(fps); if (fHist.length > 10) fHist.shift();
    const avg = fHist.reduce((a, b) => a + b, 0) / fHist.length;
    const min = Math.min(...fHist), max = Math.max(...fHist);
    fpsNow.textContent = Math.round(fps);
    fpsNow.style.color = fps >= 25 ? "#39d0ff" : fps >= 20 ? "#ffd84f" : "#ff6b6b";
    fpsMore.innerHTML = `media 10 s: ${avg.toFixed(1)} (min ${Math.round(min)} · max ${Math.round(max)})<br>${motore} · tracciamento: ${avgMs.toFixed(0)} ms`;
    if (fHist.length === 10 && now - fLogged > 10000) {
      fLogged = now;
      log(`fps media ${avg.toFixed(1)} · min ${Math.round(min)} · max ${Math.round(max)} · ${avgMs.toFixed(0)} ms · ${motore} · filtro ${filtroScelto}`);
    }
    fFrames = 0; fMs = 0; fStart = now;
  }
}
function resetFps() { fFrames = 0; fMs = 0; fStart = performance.now(); fHist = []; fLogged = performance.now(); fpsNow.textContent = "–"; }

// ---------------- filtro One Euro ----------------
class LowPass { constructor() { this.y = null; } f(x, a) { this.y = this.y === null ? x : a * x + (1 - a) * this.y; return this.y; } }
class OneEuro {
  constructor() { this.x = new LowPass(); this.dx = new LowPass(); this.prev = null; }
  alpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
  f(x, t, p) {
    if (this.prev === null) { this.prev = { x, t }; return this.x.f(x, 1); }
    const dt = Math.max((t - this.prev.t) / 1000, 1e-3);
    const dx = this.dx.f((x - this.prev.x) / dt, this.alpha(1.0, dt));
    const cutoff = p.minCutoff + p.beta * Math.abs(dx);
    this.prev = { x, t };
    return this.x.f(x, this.alpha(cutoff, dt));
  }
}
const filtriMano = {}; // un set di filtri per mano (destra/sinistra), 21 punti × x,y,z
function filtra(lm, chiave, t) {
  if (filtroScelto === "spento") return lm;
  const p = FILTRI[filtroScelto];
  const F = filtriMano[chiave] ||= lm.map(() => [new OneEuro(), new OneEuro(), new OneEuro()]);
  // le coordinate x,y sono in frazioni dell'immagine: le porto in pixel perché il filtro ragiona in "velocità"
  const W = video.videoWidth || 1, H = video.videoHeight || 1;
  return lm.map((q, i) => ({
    x: F[i][0].f(q.x * W, t, p) / W,
    y: F[i][1].f(q.y * H, t, p) / H,
    z: F[i][2].f(q.z * W, t, p) / W,
  }));
}
function azzeraFiltri() { for (const k in filtriMano) delete filtriMano[k]; }

// ---------------- geometria: dalla fotocamera allo schermo ----------------
// Il video è mostrato con object-fit: cover (ritagliato) e a specchio con la frontale.
function suSchermo(q) {
  const W = innerWidth, H = innerHeight, vw = video.videoWidth || 1, vh = video.videoHeight || 1;
  const s = Math.max(W / vw, H / vh);
  let x = (W - vw * s) / 2 + q.x * vw * s;
  const y = (H - vh * s) / 2 + q.y * vh * s;
  if (facing === "user") x = W - x;
  return { x, y };
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const media = pts => ({ x: pts.reduce((s, p) => s + p.x, 0) / pts.length, y: pts.reduce((s, p) => s + p.y, 0) / pts.length });

// palmo aperto: almeno 4 dita distese (punta più lontana dal polso della nocca media)
function palmoAperto(s) {
  const dita = [[8, 6], [12, 10], [16, 14], [20, 18]];
  const distese = dita.filter(([tip, pip]) => dist(s[tip], s[0]) > dist(s[pip], s[0]) * 1.15).length;
  return distese >= 4;
}

// ---------------- stato della scena (letto da Three.js) ----------------
const scena = {
  visibile: false, comparsa: 0,           // 0 = nascosta, 1 = del tutto comparsa
  target: null, raggio: 60,               // in pixel sullo schermo
  pos: null, r: 60,                       // posizione con la "molla"
  apertoDa: 0, ultimaMano: 0,
};
const pinch = { chiuso: false, conta: 0, punto: null, forza: 0 };

// ---------------- MediaPipe ----------------
async function creaLandmarker(delegate) {
  if (!mp) {
    log("carico MediaPipe…");
    mp = await import(MP + "/vision_bundle.mjs");
    files = await mp.FilesetResolver.forVisionTasks(MP + "/wasm");
    draw = new mp.DrawingUtils(ctx);
  }
  log(`carico il modello della mano (${delegate})…`);
  const lm = await mp.HandLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: MODEL, delegate },
    runningMode: "VIDEO", numHands: 2,
  });
  return lm;
}
async function caricaMotore(voluto) {
  const vecchio = landmarker; landmarker = null;
  try {
    landmarker = await creaLandmarker(voluto); motore = voluto;
  } catch (e) {
    log(`${voluto} non disponibile (${e.message || e}): uso CPU`);
    landmarker = await creaLandmarker("CPU"); motore = "CPU";
  }
  if (vecchio) try { vecchio.close(); } catch (e) {}
  $("engine").textContent = "Motore: " + motore;
  lastVideoTime = -1; resetFps();
  log(`modello pronto (${motore}): mostra la mano`);
}

// ---------------- Three.js: Terra, Luna, alone del pinch ----------------
async function caricaScena3D() {
  log("carico Three.js…");
  const THREE = await import(THREE_URL);
  const el = $("three");
  const renderer = new THREE.WebGLRenderer({ canvas: el, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  // camera ortografica in pixel: 1 unità = 1 pixel dello schermo, (0,0) in alto a sinistra
  const cam = new THREE.OrthographicCamera(0, 1, 0, 1, -2000, 2000);
  scene.add(new THREE.AmbientLight(0xffffff, 1.1));
  const sun = new THREE.DirectionalLight(0xffffff, 2.4);
  sun.position.set(-1, -0.6, 1.2);
  scene.add(sun);

  const tex = await new THREE.TextureLoader().loadAsync("earth.jpg");
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  log("earth.jpg: " + tex.image.width + "×" + tex.image.height + " · texture massima " + renderer.capabilities.maxTextureSize);

  const sistema = new THREE.Group();             // si sposta con il palmo
  scene.add(sistema);
  const terra = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 32),
    new THREE.MeshPhongMaterial({ map: tex, shininess: 12 }));
  terra.rotation.x = Math.PI + 0.41;             // asse inclinato di 23,4° (l'asse y dello schermo va in giù)
  sistema.add(terra);

  const orbita = new THREE.Group();               // piano dell'orbita della Luna, un po' inclinato
  orbita.rotation.x = 1.2; orbita.rotation.z = 0.25;
  sistema.add(orbita);
  const luna = new THREE.Mesh(new THREE.SphereGeometry(0.27, 32, 16),
    new THREE.MeshStandardMaterial({ color: 0xbdbdb8, roughness: 0.95 }));
  luna.position.set(2.1, 0, 0);
  orbita.add(luna);

  const alone = new THREE.Mesh(new THREE.RingGeometry(0.75, 1, 48),
    new THREE.MeshBasicMaterial({ color: 0xff4fa3, transparent: true, opacity: 0, depthTest: false }));
  alone.renderOrder = 10;
  scene.add(alone);

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    cam.left = 0; cam.right = innerWidth; cam.top = 0; cam.bottom = innerHeight;
    cam.updateProjectionMatrix();
  }
  addEventListener("resize", resize); resize();

  let prev = performance.now();
  renderer.setAnimationLoop(t => {
    const dt = Math.min((t - prev) / 1000, 0.1); prev = t;
    // comparsa / scomparsa con una piccola animazione (circa 0,3 s)
    const meta = scena.visibile ? 1 : 0;
    scena.comparsa += (meta - scena.comparsa) * (1 - Math.exp(-dt * 10));
    if (scena.target) {
      // "molla" tra palmo e pianeta: segue la mano senza scatti
      if (!scena.pos) { scena.pos = { ...scena.target }; scena.r = scena.raggio; }
      const k = 1 - Math.exp(-dt * 14);
      scena.pos.x += (scena.target.x - scena.pos.x) * k;
      scena.pos.y += (scena.target.y - scena.pos.y) * k;
      scena.r += (scena.raggio - scena.r) * k;
    }
    const s = scena.r * (0.2 + 0.8 * easeOutBack(scena.comparsa));
    sistema.visible = scena.comparsa > 0.02 && !!scena.pos;
    if (scena.pos) sistema.position.set(scena.pos.x, scena.pos.y, 0);
    sistema.scale.setScalar(Math.max(s, 0.001));
    terra.rotation.y += dt * 0.35;                 // un giro ogni ~18 s
    orbita.rotation.y += dt * 0.9;                 // la Luna gira intorno in ~7 s
    // alone del pinch
    const vis = pinch.chiuso && pinch.punto;
    alone.material.opacity += ((vis ? 0.9 : 0) - alone.material.opacity) * (1 - Math.exp(-dt * 18));
    if (pinch.punto) {
      alone.position.set(pinch.punto.x, pinch.punto.y, 1000);
      alone.scale.setScalar((pinch.misura || 60) * 0.35);
    }
    renderer.render(scene, cam);
  });
  log("Terra e Luna pronte");
}
function easeOutBack(x) { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

// ---------------- ciclo di tracciamento ----------------
function loop() {
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
    let res;
    const t0 = performance.now();
    try { res = landmarker.detectForVideo(video, t0); }
    catch (e) { info.textContent = "Errore tracciamento: " + e.message; requestAnimationFrame(loop); return; }
    countFrame(performance.now() - t0);
    aggiorna(res, t0);
  }
  requestAnimationFrame(loop);
}

function aggiorna(res, t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const mani = res.landmarks.map((lm, i) => {
    const lato = res.handednesses?.[i]?.[0]?.categoryName ?? String(i);
    const f = filtra(lm, lato, t);
    return { lato, f, s: f.map(suSchermo) };
  });

  if (scheletro) mani.forEach(m => {
    draw.drawConnectors(m.f, mp.HandLandmarker.HAND_CONNECTIONS, { color: "#39d0ff", lineWidth: 3 });
    draw.drawLandmarks(m.f, { color: "#ffffff", fillColor: "#39d0ff", radius: 4 });
  });

  // la Terra segue la prima mano vista
  const m = mani[0];
  let testo = `Mani: ${mani.length} · filtro ${filtroScelto}${filtroScelto !== "spento" ? " (" + FILTRI[filtroScelto].nome + ")" : ""}`;
  if (m) {
    scena.ultimaMano = t;
    const misura = dist(m.s[0], m.s[9]);                     // misura della mano in pixel
    const centro = media([0, 5, 9, 13, 17].map(i => m.s[i])); // centro del palmo
    scena.target = { x: centro.x, y: centro.y - misura * SOPRA_PALMO };
    scena.raggio = misura * RAGGIO_TERRA;
    const aperto = palmoAperto(m.s);
    if (!scena.visibile) {
      if (aperto) { scena.apertoDa ||= t; if (t - scena.apertoDa >= PALMO_APERTO_MS) { scena.visibile = true; log("palmo aperto: compare la Terra"); } }
      else scena.apertoDa = 0;
    }
    // pinch con isteresi
    const r = dist(m.s[4], m.s[8]) / misura;
    if (!pinch.chiuso && r < PINCH_CHIUDE) { pinch.chiuso = true; pinch.conta++; vibra(15); }
    else if (pinch.chiuso && r > PINCH_APRE) { pinch.chiuso = false; }
    pinch.punto = media([m.s[4], m.s[8]]); pinch.misura = misura;
    testo += `<br>${m.lato}: palmo ${aperto ? "aperto" : "chiuso"} · pinch ${r.toFixed(2)} (chiude &lt; ${PINCH_CHIUDE}, apre &gt; ${PINCH_APRE})`;
  } else {
    scena.apertoDa = 0;
    if (pinch.chiuso) pinch.chiuso = false;
    pinch.punto = null;
    if (scena.visibile && t - scena.ultimaMano > MANO_PERSA_MS) { scena.visibile = false; log("mano persa: la Terra sparisce"); }
  }
  if (!scena.visibile && !m) testo += "<br>Mostra il palmo aperto per mezzo secondo";
  info.innerHTML = testo;
  $("pinchN").textContent = pinch.conta;
  $("pinchState").textContent = pinch.chiuso ? "chiuso" : "aperto";
  $("pinchN").style.color = pinch.chiuso ? "#ff4fa3" : "#fff";
}
function vibra(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

// ---------------- fotocamera ----------------
async function openCamera(constraints) {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  log("chiedo la fotocamera: " + JSON.stringify(constraints));
  stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: constraints });
  const tr = stream.getVideoTracks()[0];
  const st = tr.getSettings ? tr.getSettings() : {};
  facing = st.facingMode || (constraints && constraints.facingMode) || facing || "user";
  log("fotocamera OK: " + (tr.label || "?") + " · " + (st.width || "?") + "×" + (st.height || "?") + " · " + facing);
  video.srcObject = stream;
  try { await video.play(); } catch (e) { log("play: " + e.name + " " + e.message); }
  const mir = facing === "user";
  video.classList.toggle("mirror", mir);
  canvas.classList.toggle("mirror", mir);
  for (let i = 0; i < 50 && !video.videoWidth; i++) await new Promise(r => setTimeout(r, 100));
  log("video: " + video.videoWidth + "×" + video.videoHeight);
  azzeraFiltri();
}

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  try {
    await openCamera(true);
    startBtn.hidden = true; $("tools").hidden = false;
    if (!landmarker) await caricaMotore("GPU");
    fpsBox.hidden = false; $("pinch").hidden = false; resetFps();
    if (!running) { running = true; loop(); }
    if (!threeLoaded) {
      threeLoaded = true;
      caricaScena3D().catch(e => { threeLoaded = false; log("ERRORE scena 3D: " + (e.name || "") + " · " + (e.message || e)); });
    }
  } catch (e) {
    log("ERRORE: " + e.name + " · " + e.message);
    startBtn.disabled = false;
  }
});

$("flip").addEventListener("click", async () => {
  try { await openCamera({ facingMode: facing === "user" ? "environment" : "user" }); resetFps(); }
  catch (e) { log("ERRORE cambio fotocamera: " + e.name + " · " + e.message); }
});
$("filter").addEventListener("click", e => {
  filtroScelto = ORDINE_FILTRI[(ORDINE_FILTRI.indexOf(filtroScelto) + 1) % ORDINE_FILTRI.length];
  azzeraFiltri();
  e.target.textContent = "Filtro: " + filtroScelto;
  log("filtro: " + filtroScelto + (FILTRI[filtroScelto] ? ` (minCutoff ${FILTRI[filtroScelto].minCutoff}, beta ${FILTRI[filtroScelto].beta})` : ""));
});
$("engine").addEventListener("click", async e => {
  e.target.disabled = true;
  try { await caricaMotore(motore === "GPU" ? "CPU" : "GPU"); }
  finally { e.target.disabled = false; }
});
$("skel").addEventListener("click", e => {
  scheletro = !scheletro;
  e.target.textContent = "Scheletro: " + (scheletro ? "sì" : "no");
  if (!scheletro) ctx.clearRect(0, 0, canvas.width, canvas.height);
});
$("zero").addEventListener("click", () => { pinch.conta = 0; $("pinchN").textContent = "0"; log("contatore pinch azzerato"); });
$("hide").addEventListener("click", e => {
  const l = $("log"), i = $("info");
  l.hidden = !l.hidden; i.hidden = l.hidden;
  e.target.textContent = l.hidden ? "Mostra diario" : "Nascondi diario";
});

window.addEventListener("pagehide", () => { if (stream) stream.getTracks().forEach(t => t.stop()); });

// fotocamera spenta quando la pagina va in background, riaccesa al ritorno
let wasOn = false;
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) {
    if (stream) { wasOn = true; stream.getTracks().forEach(t => t.stop()); stream = null; log("in background: fotocamera spenta"); }
  } else if (wasOn) {
    wasOn = false;
    try { await openCamera(true); resetFps(); log("di nuovo attiva"); }
    catch (e) { log("ERRORE riapertura: " + e.name + " · " + e.message); startBtn.hidden = false; startBtn.disabled = false; }
  }
});

// se il permesso è già dato, apre da sola
navigator.permissions?.query({ name: "camera" }).then(p => {
  if (p.state === "granted") { log("permesso già dato: apro da solo"); startBtn.click(); }
}).catch(() => {});
log("pronto: premi «Apri la fotocamera»");
</script>
</body>
</html>
