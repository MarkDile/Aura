<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Aura · mano</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee;
    font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  #three { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  video, canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mirror { transform: scaleX(-1); }
  #panel { position: fixed; left: 0; right: 0; top: 0; z-index: 3; padding: 12px;
    padding-top: calc(12px + env(safe-area-inset-top)); background: rgba(0,0,0,.6); }
  h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: .08em; }
  button { font: inherit; font-size: 16px; padding: 10px 18px; border-radius: 999px; border: 0;
    background: #39d0ff; color: #001018; font-weight: 600; margin: 4px 6px 4px 0; }
  button.sec { background: rgba(255,255,255,.85); }
  #info { font-size: 14px; line-height: 1.5; margin-top: 6px; }
  #log { font: 12px/1.4 ui-monospace, monospace; color: #9fe; margin-top: 6px; max-height: 30vh; overflow: auto; white-space: pre-wrap; }
  #ver { color: #888; font-size: 12px; }
  #fps { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 4;
    background: rgba(0,0,0,.7); color: #fff; border-radius: 12px; padding: 8px 12px;
    font: 600 15px/1.35 ui-monospace, monospace; text-align: right; }
  #fps b { font-size: 30px; color: #39d0ff; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="canvas"></canvas>
<canvas id="three"></canvas>

<div id="fps" hidden><b id="fpsNow">–</b> fps<br><span id="fpsMore">media 10 s: –</span></div>
<div id="panel">
  <h1>Aura <span id="ver">versione 10 · <span id="clock">0</span> s</span></h1>
  <button id="start">Apri la fotocamera</button>
  <button id="flip" class="sec" hidden>Cambia fotocamera</button>
  <button id="hide" class="sec" hidden>Nascondi diario</button>
  <div id="info">Test 4: la Terra 3D al centro dello schermo, sopra il video. Deve ruotare piano.</div>
  <div id="log"></div>
</div>

<!-- Script normale (non modulo): parte sempre, anche se MediaPipe non si carica -->
<script>
  var T0 = Date.now();
  var logEl = document.getElementById("log");
  function log(t) {
    var s = ((Date.now() - T0) / 1000).toFixed(1);
    logEl.textContent += s + " s · " + t + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }
  // orologio: se si ferma, la pagina è bloccata
  setInterval(function () {
    document.getElementById("clock").textContent = Math.round((Date.now() - T0) / 1000);
  }, 500);
  window.addEventListener("error", function (e) { log("ERRORE: " + e.message); });
  window.addEventListener("unhandledrejection", function (e) {
    log("ERRORE: " + ((e.reason && (e.reason.name + " " + e.reason.message)) || e.reason));
  });
  log("pagina caricata · " + (navigator.userAgent.match(/(SamsungBrowser|Chrome|Version)\/[\d.]+/) || ["browser ?"])[0]);
  log("HTTPS: " + window.isSecureContext + " · camera API: " + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
</script>

<script type="module">
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");
const startBtn = document.getElementById("start");
const flipBtn = document.getElementById("flip");
const hideBtn = document.getElementById("hide");
const log = window.log;

const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

let stream = null, facing = null, landmarker = null, mp = null, draw = null;
let lastVideoTime = -1, running = false, earthLoaded = false;

// --- contatore fps: fotogrammi analizzati al secondo + tempo del tracciamento ---
const fpsBox = document.getElementById("fps");
const fpsNow = document.getElementById("fpsNow");
const fpsMore = document.getElementById("fpsMore");
let fFrames = 0, fMs = 0, fStart = performance.now(), fHist = [], fLogged = 0;
function countFrame(ms) {
  fFrames++; fMs += ms;
  const now = performance.now();
  if (now - fStart >= 1000) {
    const fps = fFrames * 1000 / (now - fStart);
    const avgMs = fMs / fFrames;
    fHist.push(fps); if (fHist.length > 10) fHist.shift();
    const avg = fHist.reduce((a, b) => a + b, 0) / fHist.length;
    const min = Math.min(...fHist), max = Math.max(...fHist);
    fpsNow.textContent = Math.round(fps);
    fpsNow.style.color = fps >= 25 ? "#39d0ff" : fps >= 20 ? "#ffd84f" : "#ff6b6b";
    fpsMore.innerHTML = `media 10 s: ${avg.toFixed(1)} (min ${Math.round(min)} · max ${Math.round(max)})<br>tracciamento: ${avgMs.toFixed(0)} ms`;
    // nel diario una riga ogni 10 s, da copiare nella nota
    if (fHist.length === 10 && now - fLogged > 10000) {
      fLogged = now;
      log(`fps media ${avg.toFixed(1)} · min ${Math.round(min)} · max ${Math.round(max)} · ${avgMs.toFixed(0)} ms · ${video.videoWidth}×${video.videoHeight}`);
    }
    fFrames = 0; fMs = 0; fStart = now;
  }
}
function resetFps() { fFrames = 0; fMs = 0; fStart = performance.now(); fHist = []; fLogged = performance.now(); fpsNow.textContent = "–"; }

async function openCamera(constraints) {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  log("chiedo la fotocamera: " + JSON.stringify(constraints));
  stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: constraints });
  const tr = stream.getVideoTracks()[0];
  const st = tr.getSettings ? tr.getSettings() : {};
  facing = st.facingMode || (constraints && constraints.facingMode) || facing || "user";
  log("fotocamera OK: " + (tr.label || "?") + " · " + (st.width || "?") + "×" + (st.height || "?") + " · " + facing);
  video.srcObject = stream;
  try { await video.play(); } catch (e) { log("play: " + e.name + " " + e.message); }
  const m = facing === "user";
  video.classList.toggle("mirror", m);
  canvas.classList.toggle("mirror", m);
  for (let i = 0; i < 50 && !video.videoWidth; i++) await new Promise(r => setTimeout(r, 100));
  log("video: " + video.videoWidth + "×" + video.videoHeight);
}

async function loadMediaPipe() {
  log("carico MediaPipe…");
  mp = await import(MP + "/vision_bundle.mjs");
  const files = await mp.FilesetResolver.forVisionTasks(MP + "/wasm");
  log("carico il modello della mano (CPU)…");
  landmarker = await mp.HandLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: MODEL, delegate: "CPU" },
    runningMode: "VIDEO", numHands: 2
  });
  draw = new mp.DrawingUtils(ctx);
  log("modello pronto: mostra la mano");
}

// --- Terra 3D con Three.js (si carica dopo fotocamera e MediaPipe) ---
async function loadEarth() {
  log("carico Three.js…");
  const THREE = await import(THREE_URL);
  const el = document.getElementById("three");
  const renderer = new THREE.WebGLRenderer({ canvas: el, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  cam.position.z = 5;
  scene.add(new THREE.AmbientLight(0xffffff, 1.3));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(-2, 1.5, 5);
  scene.add(sun);
  const max = renderer.capabilities.maxTextureSize;
  log("WebGL OK · texture massima " + max + " px");
  const tex = await new THREE.TextureLoader().loadAsync("earth.jpg");
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  log("earth.jpg caricata: " + tex.image.width + "×" + tex.image.height);
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 32),
    new THREE.MeshPhongMaterial({ map: tex, shininess: 12 })
  );
  earth.rotation.x = 0.41; // inclinazione dell'asse terrestre (23,4°)
  scene.add(earth);
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    cam.aspect = w / h;
    // la Terra (diametro 2) occupa circa il 40% del lato più corto dello schermo
    const altezzaVisibile = (w < h ? 5 / cam.aspect : 5);
    cam.position.z = altezzaVisibile / (2 * Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)));
    cam.updateProjectionMatrix();
  }
  addEventListener("resize", resize); resize();
  let prev = performance.now();
  renderer.setAnimationLoop(t => {
    const dt = (t - prev) / 1000; prev = t;
    earth.rotation.y += dt * 0.35;      // un giro ogni ~18 s
    renderer.render(scene, cam);
  });
  log("Terra pronta");
}

function loop() {
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
    let res;
    const t0 = performance.now();
    try { res = landmarker.detectForVideo(video, t0); }
    catch (e) { info.textContent = "Errore tracciamento: " + e.message; requestAnimationFrame(loop); return; }
    countFrame(performance.now() - t0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let txt = `Mani: ${res.landmarks.length} · ${canvas.width}×${canvas.height}`;
    res.landmarks.forEach((lm, i) => {
      draw.drawConnectors(lm, mp.HandLandmarker.HAND_CONNECTIONS, { color: "#39d0ff", lineWidth: 4 });
      draw.drawLandmarks(lm, { color: "#ffffff", fillColor: "#39d0ff", radius: 5 });
      // pollice (4) e indice (8): servono per il pinch
      draw.drawLandmarks([lm[4], lm[8]], { color: "#ffffff", fillColor: "#ff4fa3", radius: 11 });
      draw.drawConnectors([lm[4], lm[8]], [{ start: 0, end: 1 }], { color: "#ff4fa3", lineWidth: 3 });
      const d = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
      const side = res.handednesses?.[i]?.[0]?.categoryName ?? "?";
      txt += `<br>${side}: distanza 4–8 = ${d.toFixed(3)}`;
    });
    info.innerHTML = txt;
  }
  requestAnimationFrame(loop);
}

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  try {
    await openCamera(true);              // richiesta semplice, come webcamtests
    startBtn.hidden = true; flipBtn.hidden = false; hideBtn.hidden = false;
    if (!landmarker) await loadMediaPipe();
    fpsBox.hidden = false; resetFps();
    if (!running) { running = true; loop(); }
    if (!earthLoaded) {
      earthLoaded = true;
      loadEarth().catch(e => { earthLoaded = false; log("ERRORE Terra: " + (e.name || "") + " · " + (e.message || e)); });
    }
  } catch (e) {
    log("ERRORE: " + e.name + " · " + e.message);
    startBtn.disabled = false;
  }
});

flipBtn.addEventListener("click", async () => {
  try { await openCamera({ facingMode: facing === "user" ? "environment" : "user" }); resetFps(); }
  catch (e) { log("ERRORE cambio fotocamera: " + e.name + " · " + e.message); }
});

hideBtn.addEventListener("click", () => {
  const l = document.getElementById("log");
  l.hidden = !l.hidden;
  hideBtn.textContent = l.hidden ? "Mostra diario" : "Nascondi diario";
});

window.addEventListener("pagehide", () => { if (stream) stream.getTracks().forEach(t => t.stop()); });

// fotocamera spenta quando la pagina va in background, riaccesa al ritorno
let wasOn = false;
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) {
    if (stream) { wasOn = true; stream.getTracks().forEach(t => t.stop()); stream = null; log("in background: fotocamera spenta"); }
  } else if (wasOn) {
    wasOn = false;
    try { await openCamera(true); resetFps(); log("di nuovo attiva"); }
    catch (e) { log("ERRORE riapertura: " + e.name + " · " + e.message); startBtn.hidden = false; startBtn.disabled = false; }
  }
});

// se il permesso è già dato, apre da sola
navigator.permissions?.query({ name: "camera" }).then(p => {
  if (p.state === "granted") { log("permesso già dato: apro da solo"); startBtn.click(); }
}).catch(() => {});
log("pronto: premi «Apri la fotocamera»");
</script>
</body>
</html>
