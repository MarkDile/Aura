<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Aura · mano</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee;
    font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mirror { transform: scaleX(-1); }
  #intro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px; text-align: center; z-index: 5; background: #000; }
  h1 { margin: 0; font-weight: 600; letter-spacing: .08em; }
  p { margin: 0; max-width: 32ch; color: #aaa; line-height: 1.4; }
  button { font: inherit; font-size: 17px; padding: 12px 22px; border-radius: 999px; border: 0;
    background: #39d0ff; color: #001018; font-weight: 600; }
  #hud { position: fixed; left: 12px; top: calc(12px + env(safe-area-inset-top)); z-index: 4;
    background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
  #flip { position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top)); z-index: 4;
    font-size: 14px; padding: 8px 14px; background: rgba(255,255,255,.85); }
  small { color: #666; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div id="intro">
  <h1>Aura</h1>
  <p>Test 2: la pagina disegna i 21 punti della mano sopra il video. Punta del pollice (4) e dell'indice (8) sono evidenziate.</p>
  <button id="start">Apri la fotocamera</button>
  <small id="msg">versione 3</small>
</div>

<div id="hud" hidden>Carico il modello…</div>
<button id="flip" hidden>Cambia fotocamera</button>

<script type="module">
import { FilesetResolver, HandLandmarker, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const WASM  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const flip = document.getElementById("flip");
const msg = document.getElementById("msg");
const draw = new DrawingUtils(ctx);

let landmarker = null;
let facing = "user";          // frontale: comoda per provare sulla propria mano
let stream = null;
let lastVideoTime = -1;

async function loadModel() {
  const files = await FilesetResolver.forVisionTasks(WASM);
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: MODEL, delegate },
    runningMode: "VIDEO",
    numHands: 2
  });
  try { return await HandLandmarker.createFromOptions(files, opts("GPU")); }
  catch (e) { console.warn("GPU non disponibile, uso CPU", e);
              return await HandLandmarker.createFromOptions(files, opts("CPU")); }
}

async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }
  });
  video.srcObject = stream;
  await video.play();
  const m = facing === "user";
  video.classList.toggle("mirror", m);
  canvas.classList.toggle("mirror", m);
}

function loop() {
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    if (canvas.width !== video.videoWidth) {
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    }
    const res = landmarker.detectForVideo(video, performance.now());
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let info = `Mani: ${res.landmarks.length}`;
    res.landmarks.forEach((lm, i) => {
      draw.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS, { color: "#39d0ff", lineWidth: 4 });
      draw.drawLandmarks(lm, { color: "#ffffff", fillColor: "#39d0ff", radius: 5 });
      // pollice (4) e indice (8): servono per il pinch
      draw.drawLandmarks([lm[4], lm[8]], { color: "#ffffff", fillColor: "#ff4fa3", radius: 11 });
      draw.drawConnectors([lm[4], lm[8]], [{ start: 0, end: 1 }], { color: "#ff4fa3", lineWidth: 3 });
      const d = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
      const side = res.handednesses?.[i]?.[0]?.categoryName ?? "?";
      info += `<br>${side}: distanza 4–8 = ${d.toFixed(3)}`;
    });
    hud.innerHTML = info;
  }
  requestAnimationFrame(loop);
}

document.getElementById("start").addEventListener("click", async () => {
  try {
    msg.textContent = "Apro la fotocamera…";
    await openCamera();
    document.getElementById("intro").hidden = true;
    hud.hidden = false;
    landmarker = await loadModel();
    hud.textContent = "Mostra la mano alla fotocamera";
    flip.hidden = false;
    loop();
  } catch (e) {
    msg.textContent = "Errore: " + e.message;
    console.error(e);
  }
});

flip.addEventListener("click", async () => {
  facing = facing === "user" ? "environment" : "user";
  try { await openCamera(); } catch (e) { hud.textContent = "Errore: " + e.message; }
});
</script>
</body>
</html>
